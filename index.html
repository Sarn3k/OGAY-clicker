<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OGAY Clicker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at center, #1a0a2e 0%, #0d0d1a 60%, #000005 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* Starfield background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 70%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(2px 2px at 35% 15%, rgba(180,140,255,0.7) 0%, transparent 100%),
        radial-gradient(2px 2px at 65% 85%, rgba(140,180,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 45%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 55%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 90%, rgba(255,255,255,0.5) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }

    /* Counter */
    .counter-wrapper {
      text-align: center;
      animation: fadeInDown 0.8s ease both;
    }

    .counter-label {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(200, 160, 255, 0.7);
      margin-bottom: 6px;
    }

    .counter {
      font-size: clamp(3.5rem, 10vw, 6rem);
      font-weight: 900;
      background: linear-gradient(135deg, #e0b0ff 0%, #b070ff 40%, #7030c0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      transition: transform 0.1s ease;
      filter: drop-shadow(0 0 20px rgba(160, 80, 255, 0.5));
    }

    .counter.bump {
      animation: counterBump 0.25s ease;
    }

    @keyframes counterBump {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.18); }
      70%  { transform: scale(0.96); }
      100% { transform: scale(1); }
    }

    /* Button area */
    .button-area {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeInUp 0.8s ease 0.2s both;
    }

    .btn-img {
      width: clamp(220px, 35vw, 380px);
      height: auto;
      cursor: pointer;
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.12s ease;
      filter: drop-shadow(0 0 30px rgba(160, 80, 255, 0.4));
      position: relative;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-img:hover {
      transform: scale(1.04);
      filter: drop-shadow(0 0 45px rgba(180, 100, 255, 0.7));
    }

    .btn-img:active,
    .btn-img.clicking {
      transform: scale(0.91);
      filter: drop-shadow(0 0 60px rgba(255, 180, 80, 0.8));
    }

    /* Text overlay image (popup) */
    .text-popup {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%) scale(0) translateY(0px);
      width: clamp(140px, 22vw, 260px);
      height: auto;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      filter: drop-shadow(0 0 15px rgba(255, 200, 80, 0.6));
    }

    .text-popup.show {
      animation: popText 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes popText {
      0%   { opacity: 0; transform: translateX(-50%) scale(0.4) translateY(20px); }
      25%  { opacity: 1; transform: translateX(-50%) scale(1.15) translateY(-10px); }
      55%  { opacity: 1; transform: translateX(-50%) scale(1) translateY(-18px); }
      100% { opacity: 0; transform: translateX(-50%) scale(0.8) translateY(-40px); }
    }

    /* Ripple particles */
    .particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
      animation: particleFly 0.8s ease-out forwards;
    }

    @keyframes particleFly {
      0%   { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
    }

    /* Glow ring on click */
    .glow-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
    }

    .glow-ring.burst {
      animation: ringBurst 0.5s ease-out forwards;
    }

    @keyframes ringBurst {
      0%   { opacity: 0.8; transform: scale(0.5); box-shadow: 0 0 0 0px rgba(200, 100, 255, 0.6); }
      100% { opacity: 0;   transform: scale(2);   box-shadow: 0 0 0 80px rgba(200, 100, 255, 0); }
    }

    /* Fade animations */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Subtle idle float */
    @keyframes idleFloat {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-8px); }
    }

    .btn-img:not(.clicking) {
      animation: idleFloat 3s ease-in-out infinite;
    }

    .btn-img.clicking {
      animation: none !important;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Counter -->
    <div class="counter-wrapper">
      <div class="counter-label">Clicks</div>
      <div class="counter" id="counter">0</div>
    </div>

    <!-- Button area -->
    <div class="button-area" id="buttonArea">
      <div class="glow-ring" id="glowRing"></div>
      <img
        src="Button.png"
        alt="Clicca!"
        class="btn-img"
        id="mainBtn"
        draggable="false"
      />
      <img
        src="Text.png"
        alt=""
        class="text-popup"
        id="textPopup"
        draggable="false"
      />
    </div>

  </div>

  <!-- Audio -->
  <audio id="clickAudio" preload="auto">
    <source src="Audio click.mp4" type="audio/mp4" />
  </audio>

  <script>
    const btn        = document.getElementById('mainBtn');
    const counter    = document.getElementById('counter');
    const textPopup  = document.getElementById('textPopup');
    const glowRing   = document.getElementById('glowRing');
    const audio      = document.getElementById('clickAudio');

    let count = 0;
    let popupTimeout = null;
    let clickTimeout = null;

    btn.addEventListener('click', handleClick);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); handleClick(e); }, { passive: false });

    function handleClick(e) {
      // Increment counter
      count++;
      counter.textContent = count;

      // Counter bump animation
      counter.classList.remove('bump');
      void counter.offsetWidth; // reflow trick
      counter.classList.add('bump');

      // Play audio (restart if playing)
      audio.currentTime = 0;
      audio.play().catch(() => {});

      // Button click animation
      btn.classList.add('clicking');
      clearTimeout(clickTimeout);
      clickTimeout = setTimeout(() => btn.classList.remove('clicking'), 180);

      // Glow ring burst
      glowRing.classList.remove('burst');
      void glowRing.offsetWidth;
      glowRing.classList.add('burst');

      // Text popup
      textPopup.classList.remove('show');
      void textPopup.offsetWidth;
      textPopup.classList.add('show');
      clearTimeout(popupTimeout);
      popupTimeout = setTimeout(() => textPopup.classList.remove('show'), 700);

      // Spawn particles
      spawnParticles(e);
    }

    function spawnParticles(e) {
      const rect = btn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const colors = ['#c060ff', '#ff80d0', '#ffe060', '#80c0ff', '#ff6060', '#60ffb0'];
      const count = 12 + Math.floor(Math.random() * 6);

      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.classList.add('particle');

        const angle  = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.6;
        const dist   = 60 + Math.random() * 100;
        const tx     = Math.cos(angle) * dist;
        const ty     = Math.sin(angle) * dist - 30;
        const size   = 4 + Math.random() * 8;
        const color  = colors[Math.floor(Math.random() * colors.length)];
        const dur    = 0.5 + Math.random() * 0.4;

        p.style.cssText = `
          left: ${cx}px;
          top: ${cy}px;
          width: ${size}px;
          height: ${size}px;
          background: ${color};
          box-shadow: 0 0 ${size}px ${color};
          --tx: ${tx}px;
          --ty: ${ty}px;
          animation-duration: ${dur}s;
        `;

        document.body.appendChild(p);
        setTimeout(() => p.remove(), dur * 1000 + 100);
      }
    }
  </script>
</body>
</html>
